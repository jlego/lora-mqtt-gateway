[platformio]
default_envs = esp32s3_mqtt_gateway

[env:esp32s3_mqtt_gateway]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Build flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -D MeshCore_MQTT_GATEWAY
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SX126X_DIO2_AS_RF_SWITCH=true
    -D SX126X_DIO3_TCXO_VOLTAGE=1.8  
    -D SX126X_RX_BOOSTED_GAIN=0        ; E22-400M30S internal PA, no boosted RX
    -D SX126X_EXT_PA_MAX_POWER=30      ; E22-400M30S external PA supports up to 30 dBm
    -D RADIOLIB_LOW_LEVEL              ; Enable access to protected methods like setTxParams
    ; LED pins
    -D PIN_LED_LINK=4     ; Green LED (link status)
    -D PIN_LED_DATA=5     ; Yellow LED (data activity)
    -D PIN_LED_PWR=6      ; Red LED (power)

; Board settings for PSRAM
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps = 
    jgromes/RadioLib@^6.6.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3

; Upload settings
upload_speed = 115200